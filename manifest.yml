application:
  subdomain: kindly-rss
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  public_path:
    - /
  routes:
    - /=http://kindly-rss:3000/
services:
  kindly-rss:
    environment:
      - DATA_PATH=/home/data
    # upstream: nicoan/kindly-rss-reader:0.6.0
    image: registry.lazycat.cloud/czyt/nicoan/kindly-rss-reader:ec1a4cb168a6f3bc
    binds:
      - /lzcapp/var/data:/home/data
