version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/kindly-rss.lpk
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: kindly-rss
build:
  run_buildscript: false
images:
  - id: kindly-rss
    target: service
    service: kindly-rss
    source: nicoan/kindly-rss-reader
    channel: stable
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: Kindly RSS
    summary: 专为电子墨水设备设计的自托管 RSS 和 Atom 阅读器

